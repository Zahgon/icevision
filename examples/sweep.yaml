program: train_keypoints.py
project: icevision-2.0-keypoints
method: grid
metric:
  goal: maximize
  name: KeypointMetrics/PCK@0.05
parameters:
  model.point_ratio:
    values: [32, 64]
  model.input_size:
    values: [384, 512, 768]
  model.backbone:
    values: 
      - tf_efficientnet_b0
      - tf_efficientnet_b2

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}