[project]
name = "icevision"
dynamic = ["version"]
description = "Agnostic Computer Vision Framework"
keywords = ["object detection", "machine learning"]
license = {file = "LICENSE"}
authors = [
    {name="Lucas Goulart Vazquez", email="lgvaz42@gmail.com"},
    {name="Farid Hassainia", email="ai.fast.track.farid@gmail.com"},
]
readme = "README.md"
requires-python = "==3.10.*"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch==1.13.1",
    "torchvision==0.14.1",
    "loguru",
    "albumentations>=1.0.3,<1.1",
    "tqdm",
    "fastcore>=1.3.8,<1.5",
    "numpy<2",
    "rasterio>=1.3a1,<2",
    "matplotlib>=3.2.2,<4",
    "pycocotools>=2.0.2",
    "lightning>=2.2.5",
    "scikit-learn>=1.5.2",
    "effdet>=0.4.1",
]


[dependency-groups]
dev = [
    "icedata>=0.5.1",
    "ipywidgets>=8.1.5",
    "notebook<7",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.3",
]

[tool.hatch.version]
path = "icevision/_version.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
